[build]
  command = "pnpm prisma generate && pnpm run build:client"
  publish = "dist/spa"

[functions]
  node_bundler = "esbuild"
  # Explicitly include the generated client and the required Prisma runtime
  included_files = [
    "server/generated/prisma/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true